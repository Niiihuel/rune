[package]
name = "rune-desktop"
description = "RUNE's desktop window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rune"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# The owner-authorized, unofficial login is isolated from the main limn UI.
session-login = ["dep:rune-discord-session", "dep:rune-login", "rune-login/webview"]

[dependencies]
# Interface text in the language the person chose.
rune-i18n.workspace = true
limn.workspace = true
limn-egui.workspace = true
# Opens the window and drives the frame loop; limn-egui paints into it.
eframe.workspace = true
rune-components.workspace = true
rune-core.workspace = true
# The authorized OAuth2 adapter is selected only by the desktop host.
rune-discord.workspace = true
# Optional unofficial session adapter and its isolated login process.
rune-discord-session = { workspace = true, optional = true }
rune-login = { workspace = true, optional = true }
rune-media.workspace = true
rune-model.workspace = true
# The desktop's global push-to-talk shortcut, through its portal.
rune-platform.workspace = true
rune-provider.workspace = true
rune-state.workspace = true
rune-ui.workspace = true
# RUNE's own updates: the check before the window, the mandatory update's
# window and the optional one's installation.
rune-update.workspace = true
# Which characters a font draws, to fall back to a system font for the rest;
# the same version egui already builds to read fonts.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Saves `--screenshot` captures as PNG; already built for limn-egui's images.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
# rune.exe's icon and version information on Windows (build.rs): rc.exe
# with MSVC, windres with MinGW. Without its `toml` feature it only brings
# version_check. A `cfg(windows)` build dependency would ask about the
# machine that builds, not the target, so it is built everywhere and does
# nothing off Windows.
winresource = { version = "0.1.34", default-features = false }
