# cargo-about: the licenses of every crate that can reach a RUNE binary, on
# Linux and on Windows, rendered into THIRD_PARTY_NOTICES.md with about.hbs
# (which also carries what Cargo does not know: fonts, Twemoji, the GIPHY
# mark). Regenerate after any change to Cargo.lock (docs/SECURITY.md):
#
#   cargo about generate --locked --offline --all-features about.hbs -o THIRD_PARTY_NOTICES.md
#
# --offline reads only what the crates carry (no clearlydefined.io), so the
# output is the same on every machine; the release workflow regenerates it
# that way and fails when the committed file differs.

# The same set cargo deny allows (deny.toml), plus the licenses it allows
# crate by crate; in order of preference where a crate offers a choice (MIT
# first: the shortest, with no NOTICE file to carry).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
]
# Tests never ship; build scripts are kept, to be safe.
ignore-dev-dependencies = true

# RUNE's own crates (publish = false) are MIT OR Apache-2.0, in LICENSE-*.
[private]
ignore = true
