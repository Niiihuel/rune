# cargo deny check: licenses, security advisories, crate sources and bans
# over the locked graph (docs/SECURITY.md). Run by CI on every push.

[graph]
# Every feature, so the optional login WebView and its crates are checked too;
# no target filter, so are those of Windows and macOS.
all-features = true

[advisories]
ignore = [
    # instant is unmaintained. It reaches RUNE only through openmls' `js`
    # feature, which davey (Discord's DAVE end-to-end encryption) turns on;
    # nothing calls it outside a browser. Blocked upstream: remove once davey
    # stops turning it on (tasks/todo.md, «Bloqueado aguas arriba»).
    { id = "RUSTSEC-2024-0384", reason = "unmaintained, reached only through davey -> openmls/js; blocked upstream" },
    # zvariant and zbus_names were merged into zbus 6; no vulnerability. zbus
    # 5 stays while eframe's accessibility (accesskit) and secret-service
    # need it; move rune-platform to zbus 6 together with them.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; accesskit and secret-service still need zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; accesskit and secret-service still need zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; accesskit and secret-service still need zbus 5" },
]

[licenses]
# The licenses the dependencies actually declare; RUNE itself is MIT OR Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = [
    # File-level copyleft, allowed crate by crate so a new MPL dependency
    # fails until someone looks at it: hpke-rs (patched in vendor/hpke-rs,
    # its MPL notice kept) and symphonia, which decodes audio attachments.
    # Their own files stay MPL-2.0; nothing of RUNE's becomes it.
    { crate = "hpke-rs", allow = ["MPL-2.0"] },
    { crate = "hpke-rs-crypto", allow = ["MPL-2.0"] },
    { crate = "hpke-rs-rust-crypto", allow = ["MPL-2.0"] },
    { crate = "symphonia", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-flac", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-aac", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-pcm", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-vorbis", allow = ["MPL-2.0"] },
    { crate = "symphonia-core", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-isomp4", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-mkv", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-ogg", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-riff", allow = ["MPL-2.0"] },
    { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
    { crate = "symphonia-utils-xiph", allow = ["MPL-2.0"] },
    # The fonts egui embeds keep their own licenses, apart from the code's.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
# RUNE's own crates are never published (`publish = false`).
ignore = true

[bans]
# Duplicates come from the window, audio and video stacks; not an error.
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates and the vendored DAVE crates (vendor/: davey,
# openmls_rust_crypto, openmls_basic_credential, hpke-rs) are path
# dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# limn, RUNE's interface toolkit, is used from its own repository's branch.
# cpal is pinned to its upstream WASAPI silent-capture fix until it ships.
allow-git = ["https://github.com/Niiihuel/limn", "https://github.com/RustAudio/cpal"]
