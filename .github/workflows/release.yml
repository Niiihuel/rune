# A release for every tag v* pushed (docs/UPDATES.md): the tag must be
# annotated and name the workspace's version; each platform's artifact is
# built and uploaded to a draft release; the manifest is written, signed
# with the RUNE_UPDATE_SIGNING_KEY secret, checked against the key
# compiled into RUNE, and only then is the release published. Until that
# last step no RUNE can see it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time per tag, never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

# Actions are pinned by commit, the release they were in beside it, as in
# ci.yml.
jobs:
  draft:
    name: tag, versión y borrador
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The checkout leaves the pushed tag lightweight; its annotation holds
      # the notes and the word «obligatoria».
      - run: git fetch --force --tags origin
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: el tag es anotado y nombra la versión del workspace
        run: cargo run --locked --quiet -p rune-update --example release -- tag "$TAG"
      # Every artifact carries THIRD_PARTY_NOTICES.md (`rune --licenses`):
      # regenerated from the lock exactly as about.toml says, it must be the
      # committed one, or the release stops before anything is built.
      # `cat -s` squeezes blank lines: cargo-about picks between a crate's
      # near-identical license files in file system order
      # (docs/UPDATES.md#avisos-de-terceros).
      - name: avisos de terceros al día
        run: |
          cargo install cargo-about --locked --version 0.9.0 --features cli
          cargo fetch --locked
          cargo about generate --locked --offline --all-features about.hbs | cat -s > THIRD_PARTY_NOTICES.md
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: borrador de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$TAG" > notes.md
          # A pre-release (v1.2.0-rc.1) never becomes the latest one, so
          # installed copies never see it.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "RUNE ${TAG#v}" \
            --notes-file notes.md "${prerelease[@]}"

  linux:
    name: Linux x86_64
    needs: draft
    # glibc 2.39 and WebKitGTK 6: the oldest base the unofficial session's
    # login builds on (docs/UPDATES.md#linux).
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The distribution's libraries, not Nix's: the program must find them
      # where every distribution keeps them (no /nix/store run path).
      - name: dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake nasm clang libclang-dev pkg-config \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libxkbcommon-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: compilar
        env:
          # The symbols stay, for a panic's backtrace in the log.
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked -p rune-desktop --features session-login
      # The libraries it needs at run time, in the log (docs/UPDATES.md).
      - run: ldd target/release/rune
      - name: el programa lleva los avisos de terceros
        run: target/release/rune --licenses | cmp - THIRD_PARTY_NOTICES.md
      - run: gzip -9 -n -c target/release/rune > rune-x86_64-linux.gz
      - name: subir
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" rune-x86_64-linux.gz --clobber

  windows:
    name: Windows x86_64
    needs: draft
    # Off until the owner sets the repository variable RUNE_WINDOWS_RELEASES
    # to "true"; while it is off the release goes out for Linux alone.
    # Contract with the updater: docs/UPDATES.md#windows.
    if: vars.RUNE_WINDOWS_RELEASES == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    # What the manifest's step checks the downloaded installer against.
    outputs:
      sha256: ${{ steps.installer.outputs.sha256 }}
      size: ${{ steps.installer.outputs.size }}
    defaults:
      run:
        shell: bash
    env:
      # Git's bash would turn /VERYSILENT or /DVersion=… into paths.
      MSYS_NO_PATHCONV: "1"
    steps:
      # The sources as they are in the repository, as ci.yml: Git for
      # Windows would turn their line ends into CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: compilar
        env:
          # The C runtime inside rune.exe, so no Visual C++ Redistributable
          # has to be installed; with --target it reaches only the program,
          # not build scripts.
          RUSTFLAGS: -C target-feature=+crt-static
        run: >-
          cargo build --release --locked --target x86_64-pc-windows-msvc
          -p rune-desktop --features session-login
      - name: el programa lleva los avisos de terceros
        run: target/x86_64-pc-windows-msvc/release/rune.exe --licenses | cmp - THIRD_PARTY_NOTICES.md
      # The DLLs it loads, in the log, as ldd on Linux: Windows' own only.
      - name: DLLs
        run: |
          vswhere="C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          dumpbin=$("$vswhere" -latest -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -n 1)
          "$(cygpath -u "$dumpbin")" -nologo -dependents target/x86_64-pc-windows-msvc/release/rune.exe
      # Inno Setup builds the per-user installer (packaging/windows/rune.iss):
      # a fixed version with its digest, not whatever the image carries.
      # Relative paths or cygpath -w: without the path conversion, a native
      # program would misread /d/a/….
      - name: Inno Setup 6.7.3
        run: |
          curl -fsSL -o innosetup.exe \
            https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          echo "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732  innosetup.exe" \
            | sha256sum -c -
          ./innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER \
            "/DIR=$(cygpath -w "$PWD/.innosetup")"
      # The installer puts THIRD_PARTY_NOTICES.md, LICENSE-MIT,
      # LICENSE-APACHE and assets/licenses beside rune.exe.
      - name: instalador por usuario
        id: installer
        run: |
          .innosetup/ISCC.exe /Q "/DVersion=${TAG#v}" 'packaging\windows\rune.iss'
          setup=target/rune-x86_64-windows-setup.exe
          sha256=$(sha256sum "$setup" | cut -d ' ' -f 1)
          size=$(stat -c %s "$setup")
          echo "$setup: $size bytes, SHA-256 $sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
      - name: subir
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" target/rune-x86_64-windows-setup.exe --clobber

  publish:
    name: manifiesto firmado y publicación
    needs: [linux, windows]
    # A Windows job that is off (skipped) still lets the release out.
    if: ${{ !cancelled() && needs.linux.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.windows.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Every annotated tag: minimum_version comes from their messages.
      - run: git fetch --force --tags origin
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Built before the secret is in the environment, so no build script
      # ever runs with it.
      - run: cargo build --locked --quiet -p rune-update --example release
      - name: artefactos
        run: gh release download "$TAG" --pattern 'rune-x86_64-*' --dir dist
      # The installer in the draft is the one the Windows job built.
      - name: instalador de Windows
        if: needs.windows.result == 'success'
        env:
          SHA256: ${{ needs.windows.outputs.sha256 }}
          SIZE: ${{ needs.windows.outputs.size }}
        run: |
          echo "$SHA256  dist/rune-x86_64-windows-setup.exe" | sha256sum -c -
          test "$(stat -c %s dist/rune-x86_64-windows-setup.exe)" = "$SIZE"
      - name: manifiesto
        run: |
          artifacts=()
          [ -f dist/rune-x86_64-linux.gz ] && artifacts+=("linux-x86_64=dist/rune-x86_64-linux.gz")
          [ -f dist/rune-x86_64-windows-setup.exe ] && artifacts+=("windows-x86_64=dist/rune-x86_64-windows-setup.exe")
          target/debug/examples/release manifest "$TAG" \
            "https://github.com/$GH_REPO/releases/download/$TAG" "${artifacts[@]}" \
            > dist/rune-update.json
          cat dist/rune-update.json
      - name: firma
        env:
          RUNE_UPDATE_SIGNING_KEY: ${{ secrets.RUNE_UPDATE_SIGNING_KEY }}
        run: target/debug/examples/release sign dist/rune-update.json
      # With the key compiled into RUNE: a secret that does not match
      # crates/rune-update/release-key.pub stops the release here.
      - run: target/debug/examples/release verify dist/rune-update.json
      - name: publicar
        run: |
          # The notices beside the program too, for whoever reads the
          # release page; the program carries the same (`rune --licenses`).
          tar -czf dist/rune-licenses.tar.gz THIRD_PARTY_NOTICES.md \
            LICENSE-MIT LICENSE-APACHE assets/licenses
          gh release upload "$TAG" dist/rune-update.json dist/rune-update.json.sig \
            THIRD_PARTY_NOTICES.md dist/rune-licenses.tar.gz --clobber
          gh release edit "$TAG" --draft=false
