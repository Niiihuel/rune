<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- RUNE's icon for 16, 24 and 32 px: the tile fills the box, a 24th in
       from each side, and the mark (rune-mark.svg) sits on whole pixels,
       1.5 units a cell here (1 at 16 px, 2 at 32 px). -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B080A"/>
      <stop offset="1" stop-color="#E0292B"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="22" height="22" rx="5.5" fill="url(#red)"/>
  <g transform="translate(4 6) scale(1.5)" fill="#fff">
    <path d="M3 0L6 0L9 3L6 3Z"/>
    <path d="M0 1L3 1L10 8L7 8Z"/>
    <path d="M0 4L3 4L3 8L0 8Z"/>
  </g>
</svg>
